[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "reasoner"
version = "2.1.0"
description = "Multi-model reasoning pipeline orchestrator"
requires-python = ">=3.12"
license = "BUSL-1.1"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.0.0,<3"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# B (bugbear) + F821 (undefined names) merged in from the old CI-only
# `--select B,F821` flag, which used to shadow this profile entirely: ruff's
# CLI --select replaces config select, so the E/I/N/W/UP rules below never
# executed in CI. CI now runs bare `ruff check src/` so this is authoritative.
select = ["E", "F", "I", "N", "W", "UP", "B"]
# B008 (function call in default arg) — deliberate FastAPI pattern (Depends()).
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_any_unimported = false

[[tool.mypy.overrides]]
module = "reasoner.infrastructure.llm.providers.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "reasoner.infrastructure.widgets.*"
ignore_errors = true
