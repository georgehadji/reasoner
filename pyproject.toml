[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoner"
version = "2.1.0"
description = "Multi-model reasoning pipeline orchestrator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0,<0.117.0",
    "uvicorn[standard]>=0.27.0,<0.35.0",
    "python-multipart>=0.0.6,<0.1.0",
    "anthropic>=0.18.0,<0.50.0",
    "openai>=1.12.0,<2.0.0",
    "google-genai>=1.0.0,<2.0.0",
    "httpx>=0.27.0,<0.29.0",
    "supabase>=2.0.0,<3.0.0",
    "PyJWT>=2.8.0,<3.0.0",
    "valkey>=6.0.0",
    "stripe>=12.0.0,<16.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pypdf>=4.0.0,<7.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "pymupdf>=1.23.0,<2.0.0",
    "python-magic>=0.4.27,<0.5.0",
    "asteval>=0.9.32,<1.0.0",
    "yfinance>=0.2.36,<0.3.0",
    "yahooquery>=2.3.0,<3.0.0",
    "lxml>=5.1.0,<6.0.0",
    "asyncpg>=0.29.0,<0.31.0",
    "aiosqlite>=0.19.0,<0.21.0",
    "alembic>=1.13.0,<2.0.0",
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
    "psutil>=5.9.0",
    "cryptography>=42.0.0",
    "tenacity>=8.2.3,<9.0.0",
    "aiocircuitbreaker>=2.0.0,<3.0.0",
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<0.25.0",
    "pytest-timeout>=2.0.0,<3.0.0",
    "pytest-xdist>=3.0.0,<4.0.0",
    "gunicorn>=22.0.0,<24.0.0",
    "import-linter>=2.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_any_unimported = false

[[tool.mypy.overrides]]
module = "reasoner.infrastructure.llm.providers.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "reasoner.infrastructure.widgets.*"
ignore_errors = true
