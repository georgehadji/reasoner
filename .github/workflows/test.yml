name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.12'
  PYTHONPATH: src

jobs:
  pytest:
    name: pytest (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pytest-cov bandit mypy

      - name: Lint (ruff)
        run: |
          pip install ruff
          # No --select/--ignore override: ruff's CLI --select previously *replaced*
          # pyproject.toml's [tool.ruff.lint] select entirely, so the configured
          # E/F/I/N/W/UP profile never ran in CI — only the CLI's B,F821 did. The
          # full profile (now including B) lives in pyproject.toml; bare `ruff check`
          # picks it up. Ratcheted (scripts/ruff_ratchet.py) rather than hard-blocked:
          # turning the full profile on surfaced 2241 pre-existing violations.
          # 2239: merging the unpushed local branch added debt from commits never
          # counted against this ratchet; ruff's own safe --fix paid most of it
          # back down. The +1 is one E402 in api/dependencies.py, whose import
          # block already sits below a statement -- get_preset_tier has to be
          # module-level there because the tests patch it as a module attribute.
          # 2237: the propagation-resistance work replaced four hand-rolled copies
          # of the web-snippet block with build_web_sources_block(), retiring two
          # long lines along with the duplication.
          # 2260: NOT a paydown of 2237 -- measured 2261 at 80e36b8 in a clean
          # worktree, i.e. this gate was already failing by 24 before the alias
          # rename touched anything. Commits since 2237 was set moved the count
          # without moving MAX. The rename itself is -1 (two duplicate
          # _MODEL_LABS keys removed, one E501 reflowed, three import blocks
          # re-sorted after the symbol renames). Whoever finds the 23-violation
          # drift is welcome to bisect it; this number is the honest count now.
          # 2253: W2 (docs/plans/gate-and-registry-remediation.md) deleted the
          # dead GateAgent class, its drifted _TAXONOMY, and the unused imports
          # that came with it -- -7, a real paydown from removing code, not a
          # rename.
          # 2251: W6 deleted harness_guard.py's hand-maintained ~150-entry
          # _MODEL_LABS dict in favour of ModelRegistryPort.vendor_of() -- -2.
          # 2244: paying for W5. tests/architecture/test_layer_boundaries.py
          # pins api/__init__.py at 1104 lines with the rule "do not raise a cap
          # without shrinking the corresponding module first", so the cache-port
          # wiring moved to infrastructure/valkey/cache_adapter.py and three dead
          # stdlib imports (secrets, json, datetime/timezone) went with it -- -4
          # F401 there, +2 elsewhere in the moved block.
          # 2243: removing two delisted models (kwaipilot/kat-coder-air-v2.5,
          # arcee-ai/virtuoso-large) took one E501 comment line with them, and
          # three over-long registry comments added alongside the new models were
          # reflowed under 100 -- -4 against this branch, -1 against main.
          python scripts/ruff_ratchet.py --max 2243

      - name: Security scan (bandit)
        run: |
          bandit -r src/ -t B307,B308,B102 -f txt

      - name: Type check auth_legacy (mypy --strict)
        run: |
          mypy --strict src/reasoner/infrastructure/auth_legacy.py --ignore-missing-imports

      - name: Type check src/ (mypy, ratcheted)
        run: |
          # Previously mypy ran on exactly this one file. Running the configured
          # (non-strict) profile over the full tree surfaced 429 pre-existing
          # errors across 128 files — ratcheted, not hard-blocked, same pattern
          # as scripts/ruff_ratchet.py.
          # 426: restoring the stripped re-export shims (models.py, phases/_shared.py,
          # api/run_state.py, infrastructure/renderer.py) resolved the type errors
          # that the broken imports were producing.
          # 423: NOT a paydown by the commit that lowered it (W4). Measured on a
          # tree with W4's source changes stashed: also 423, and the two error
          # sets are identical line-for-line apart from line numbers shifted by
          # W4's added lines. Commits since 426 was set moved the count without
          # moving MAX -- the same drift the ruff ratchet hit at 2260. This is
          # the honest count now; whoever wants the three back can bisect them.
          python scripts/mypy_ratchet.py --max 423

      - name: Run tests
        run: |
          pytest tests/ -v \
            -m "not slow and not integration" \
            --tb=short \
            --timeout=60 \
            -q
        env:
          PYTHONPATH: ${{ env.PYTHONPATH }}
          CSRF_ENFORCE_BACKEND: 'false'
          # Dummy placeholder (NOT a real credential): build_provider() only checks
          # key presence. Mock tests patch ProviderRouter.call, so no network occurs.
          # Lets router/provider construction succeed for HyperGate models offline.
          OPENROUTER_API_KEY: 'ci-dummy-openrouter-key-placeholder'
          # Dummy placeholder (NOT a real credential): LocalAuthAdapter validates
          # JWT_SECRET_KEY length on instantiation during SaaS/auth test collection.
          JWT_SECRET_KEY: 'ci-test-secret-key-not-for-production-use-only'
          # CI has no Redis. The limiter defaults to redis + fail_closed, which
          # denies every request (429) when Redis is unreachable — tripping ~40
          # endpoint tests that expect 200/401. fail_open degrades gracefully to
          # the in-memory limiter, which still enforces limits for the dedicated
          # rate-limiter tests while letting normal requests through.
          RATE_LIMITER_REDIS_FAILURE_MODE: 'fail_open'

  tsc:
    name: TypeScript type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-next
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # ui-next has had 23 vitest files and no job running them: the `npm test`
      # in the sdk job below caches a different lockfile, and quality.yml's
      # Playwright a11y spec is continue-on-error. So these 211 assertions,
      # four of them security suites, have never gated a merge.
      #
      # Here rather than in quality.yml: that workflow is path-filtered to
      # ui-next/** and advisory, and a backend change can break a frontend
      # contract test without touching a single ui-next file.
      - name: Test
        run: npm test

      - name: Design token guard (no raw Tailwind palette colors)
        run: |
          # global-error.tsx is exempt: it renders outside the root layout
          # (no globals.css, var() resolves to nothing there), so it uses
          # literal hex mirroring the tokens instead.
          ! grep -rEn --include=*.tsx --include=*.ts \
            --exclude=global-error.tsx \
            '(bg|text|border|from|to|via|ring|fill|stroke)-(slate|gray|zinc|neutral|stone|red|orange|amber|yellow|lime|green|emerald|teal|cyan|sky|blue|indigo|violet|purple|fuchsia|pink|rose)-[0-9]{2,3}' \
            src

  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      # tsconfig.build.json sets "types": [], so this also proves src/ pulls in
      # no Node globals — the SDK ships to browsers as well.
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.build.json

      - name: Test
        run: npm test
