name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.12'
  PYTHONPATH: src

jobs:
  pytest:
    name: pytest (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-asyncio pytest-cov bandit mypy

      # F821 is blocking. It is not style: it finds names that do not exist at
      # the point they are used. It had been reporting a real one for a while —
      # infrastructure/rate_limiter.py referenced REASONER_RATE_LIMIT_REJECTED
      # with its import commented out — but --exit-zero meant nobody saw it.
      # The B (bugbear) rules stay advisory; they carry more judgement calls.
      - name: Lint — undefined names (blocking)
        run: |
          pip install ruff
          ruff check src/ --select F821

      - name: Lint — bugbear (advisory)
        run: ruff check src/ --select B --ignore B008 --exit-zero

      - name: Security scan (bandit)
        run: |
          bandit -r src/ -t B307,B308,B102 -f txt --exit-zero

      - name: Type check auth_legacy (mypy)
        run: |
          mypy --strict src/reasoner/infrastructure/auth_legacy.py --ignore-missing-imports || true

      - name: Run tests
        run: |
          pytest tests/ -v \
            -m "not slow and not integration" \
            --tb=short \
            --timeout=60 \
            -q
        env:
          PYTHONPATH: ${{ env.PYTHONPATH }}
          CSRF_ENFORCE_BACKEND: 'false'
          # Dummy placeholder (NOT a real credential): build_provider() only checks
          # key presence. Mock tests patch ProviderRouter.call, so no network occurs.
          # Lets router/provider construction succeed for HyperGate models offline.
          OPENROUTER_API_KEY: 'ci-dummy-openrouter-key-placeholder'
          # Dummy placeholder (NOT a real credential): LocalAuthAdapter validates
          # JWT_SECRET_KEY length on instantiation during SaaS/auth test collection.
          JWT_SECRET_KEY: 'ci-test-secret-key-not-for-production-use-only'
          # CI has no Redis. The limiter defaults to redis + fail_closed, which
          # denies every request (429) when Redis is unreachable — tripping ~40
          # endpoint tests that expect 200/401. fail_open degrades gracefully to
          # the in-memory limiter, which still enforces limits for the dedicated
          # rate-limiter tests while letting normal requests through.
          RATE_LIMITER_REDIS_FAILURE_MODE: 'fail_open'

  tsc:
    name: TypeScript type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-next
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
