name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.14'
  PYTHONPATH: src

jobs:
  pytest:
    name: pytest (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pytest-cov bandit mypy

      - name: Lint (ruff)
        run: |
          pip install ruff
          # No --select/--ignore override: ruff's CLI --select previously *replaced*
          # pyproject.toml's [tool.ruff.lint] select entirely, so the configured
          # E/F/I/N/W/UP profile never ran in CI — only the CLI's B,F821 did. The
          # full profile (now including B) lives in pyproject.toml; bare `ruff check`
          # picks it up. Ratcheted (scripts/ruff_ratchet.py) rather than hard-blocked:
          # turning the full profile on surfaced 2241 pre-existing violations.
          # 2239: merging the unpushed local branch added debt from commits never
          # counted against this ratchet; ruff's own safe --fix paid most of it
          # back down. The +1 is one E402 in api/dependencies.py, whose import
          # block already sits below a statement -- get_preset_tier has to be
          # module-level there because the tests patch it as a module attribute.
          # 2237: the propagation-resistance work replaced four hand-rolled copies
          # of the web-snippet block with build_web_sources_block(), retiring two
          # long lines along with the duplication.
          # 2260: NOT a paydown of 2237 -- measured 2261 at 80e36b8 in a clean
          # worktree, i.e. this gate was already failing by 24 before the alias
          # rename touched anything. Commits since 2237 was set moved the count
          # without moving MAX. The rename itself is -1 (two duplicate
          # _MODEL_LABS keys removed, one E501 reflowed, three import blocks
          # re-sorted after the symbol renames). Whoever finds the 23-violation
          # drift is welcome to bisect it; this number is the honest count now.
          # 2253: W2 (docs/plans/gate-and-registry-remediation.md) deleted the
          # dead GateAgent class, its drifted _TAXONOMY, and the unused imports
          # that came with it -- -7, a real paydown from removing code, not a
          # rename.
          # 2251: W6 deleted harness_guard.py's hand-maintained ~150-entry
          # _MODEL_LABS dict in favour of ModelRegistryPort.vendor_of() -- -2.
          # 2244: paying for W5. tests/architecture/test_layer_boundaries.py
          # pins api/__init__.py at 1104 lines with the rule "do not raise a cap
          # without shrinking the corresponding module first", so the cache-port
          # wiring moved to infrastructure/valkey/cache_adapter.py and three dead
          # stdlib imports (secrets, json, datetime/timezone) went with it -- -4
          # F401 there, +2 elsewhere in the moved block.
          # 2236 on main: removing eight dead registry aliases (seven ~*-latest ids
          # that answered `is not a valid model ID`, plus hermes-4-70b whose only
          # endpoint was down) took six E501 comment lines with them. Before that,
          # two independent passes each took 2244 to 2243 and composed to 2242.
          # This merge then deprecated all six remaining :free tiers, which took
          # more long comment lines out. Re-measured on the merged tree rather than
          # carried from either side, because the paydowns compose.
          # 2285: P4 step 4 (docs/plans/root-cause-remediation-2026-09-07.md)
          # added two honestly-named whitelist entries (ling-3.0-flash,
          # nex-n2-pro) as drop-ins for their misleadingly-named :free
          # counterparts. Same long single-line-dict-plus-comment convention
          # as every other registry.py entry -- +2 E501.
          # 2283: P2 (docs/plans/root-cause-remediation-2026-09-07.md) deleted
          # infrastructure/llm/ports.py's second BaseLLMProvider -- ~155 lines
          # of a duplicate retry/health implementation nothing in src/ used --
          # and collapsed infrastructure/llm/exceptions.py from a rival error
          # tree into alias imports. -2 net against the lines _translate adds.
          python scripts/ruff_ratchet.py --max 2283

      - name: Security scan (bandit)
        run: |
          bandit -r src/ -t B307,B308,B102 -f txt

      - name: Type check auth_legacy (mypy --strict)
        run: |
          mypy --strict src/reasoner/infrastructure/auth_legacy.py --ignore-missing-imports

      - name: Type check src/ (mypy, ratcheted)
        run: |
          # Previously mypy ran on exactly this one file. Running the configured
          # (non-strict) profile over the full tree surfaced 429 pre-existing
          # errors across 128 files — ratcheted, not hard-blocked, same pattern
          # as scripts/ruff_ratchet.py.
          # 426: restoring the stripped re-export shims (models.py, phases/_shared.py,
          # api/run_state.py, infrastructure/renderer.py) resolved the type errors
          # that the broken imports were producing.
          # 423: NOT a paydown by the commit that lowered it (W4). Measured on a
          # tree with W4's source changes stashed: also 423, and the two error
          # sets are identical line-for-line apart from line numbers shifted by
          # W4's added lines. Commits since 426 was set moved the count without
          # moving MAX -- the same drift the ruff ratchet hit at 2260. This is
          # the honest count now; whoever wants the three back can bisect them.
          python scripts/mypy_ratchet.py --max 423

      - name: Silent-failure ratchet (bare except-Exception swallows)
        run: |
          # docs/plans/root-cause-remediation-2026-09-07.md P5. Counts
          # `except Exception` blocks whose body is a bare `pass` or `return`
          # with no log, no re-raise, no degradation record -- the D11 class
          # of bug (NEMOTRON_RERANK_MODEL 404ing silently on every call).
          # Ratcheted, same two-way pattern as ruff_ratchet.py.
          # 114: P5 steps 1/2 landed core/degrade.py, PipelineState.degradations
          # and reasoner_degradation_total, then routed three sites through it:
          # synthesis promotion rules (their absence leaves a run overclaiming
          # VERIFIED), PoT execution evidence, and the dialectical antithesis
          # search. The script also stopped counting two things it should never
          # have counted -- the pattern shown inside core/degrade.py's own
          # docstring, and `return degraded(...)` itself, which is the fix.
          # 113: the body pattern did not match a swallow with a trailing
          # comment (`pass  # best-effort`), so 7 sites had never been counted
          # at all. Fixing that raised the real count to 121; converting the 7
          # HyperGate _parse_result swallows and event_emission_service's
          # dropped-event pass brings it to 113. The HyperGate ones matter
          # because a malformed-JSON reply there returns `confidence: 0.0` with
          # `error=None`, which the base class reads as a valid low-confidence
          # answer -- a routing failure indistinguishable from a routing
          # opinion, and no log anywhere.
          # 110: three of infrastructure/llm/executor.py's seven swallows.
          # The cost-estimate one is the D11 shape again -- a pricing lookup
          # that raises leaves cost_usd at 0, so total_cost_usd stops growing,
          # the spend ceilings never fire, and the run reports $0.00, which is
          # what a cache hit also looks like. The other two are inside
          # _halt_on_cap: which ceiling was hit, and the SPEND_CAP_EXCEEDED
          # event that billing reads. The four left counted are all
          # Prometheus-emit failures (CACHE_HITS, CACHE_MISSES, the run-cost
          # gauge, the cap counter). A metrics backend being unreachable does
          # not change what the run does, and routing it through a WARNING
          # helper that itself increments a metric spends the signal. They
          # stay counted rather than being quietly converted to the DEBUG line
          # this script's own docstring names as the D11 failure.
          # 106: neuro/sessions.py's four readers. Every caller checks
          # .exists() before reading, so an exception there is a real read
          # failure on a file that is present -- and the [] it returned is
          # indistinguishable from a session with no history, which
          # get_recent_context() then injects as bootstrap context.
          # _count_entries also cached the 0 from a failed read, pinning that
          # file at zero exchanges for the process lifetime; it no longer
          # caches a count it could not measure. neuro/providers.py's four are
          # left counted on purpose: they are all `health_check` returning
          # False, where the exception IS the answer, and they are the only
          # four such sites left in the whole count.
          # 100: all six in saas_router.delete_account -- GDPR Article 17
          # erasure. Phase 3 (uploads, history files, vector indexes, Redis
          # keys) runs after the DB transaction commits and every failure in
          # it was a bare pass, so the endpoint returned
          # {"status": "deleted"} with a clean 200 whether any of those stores
          # was actually cleared or not. It now returns a "failed" list, so a
          # caller told their data is erased can see what still holds it.
          # The uploads block also left user_uploads unbound on failure, and
          # the vector-store block iterates it -- so one failure raised
          # NameError there and was swallowed by that block's own handler,
          # costing two erasure phases for the price of one.
          # 95: PhaseSpan's five, core/observability/phase_span.py. Every
          # Langfuse enrichment -- the model name, token counts, phase cost,
          # fallback count, and the span.update() that closes the span --
          # was a bare pass. A span with no cost_usd is not a free phase but
          # every dashboard summing that field reads it as one, and a failed
          # span.update() leaves the span open in Langfuse, which reads as a
          # phase still running. Same commit fixes the span's own input:
          # start_time was time.monotonic() (seconds since boot) next to a
          # time.time() end_time, so no span ever had a usable start.
          # 91: the four in infrastructure/cached_quota_repo.py, removed by
          # deleting the module. It was a second CachedQuotaRepository that no
          # module in src/ imported -- api/dependencies.py wires the one in
          # infrastructure/persistence/ -- and its cache had never once worked:
          # it called UsageQuota.model_dump_json() on what is a
          # @dataclass(frozen=True), so every write raised AttributeError into
          # `except Exception: pass` and nothing was ever stored. A cache that
          # hid its own total failure behind the swallow this ratchet counts.
          # tests/test_quota_redis_fallback.py now covers the live class, whose
          # failure paths test_saas_cached_quota.py did not reach.
          # 88: spend_limit_service.py's three, all lazy imports behind the
          # preflight spend guard, and all three failed open. No prices means
          # pricing_data_available() returns False, which the caller reads as
          # permission to skip the per-run ceiling. No routing means
          # estimate_run_cost returns 0.0, and 0.0 is under every ceiling. No
          # preset tier means FREE, which is below every required rank, so the
          # tier refusal cannot fire. A guard that had stopped guarding was
          # indistinguishable from one with nothing to refuse.
          # 81: the seven benchmark suites in infrastructure/benchmarks/
          # suites/. Each divides its passing samples by the number attempted,
          # so a judge call that raised scored exactly like one that returned a
          # wrong answer: a suite whose provider was down reported 0.0 over its
          # full sample count. engine.benchmark_model writes that straight into
          # the capability registry routing reads, so an outage was recorded as
          # a measured incapability. The handlers now count the failure and one
          # report_failed_samples() per suite names it. json_fidelity.py's was
          # the same swallow written `except (json.JSONDecodeError, Exception)`,
          # which this regex never matched -- fixed in the same change, so the
          # count moves by seven and not eight.
          # 76: start_all.py's five. Three of them turned a failed *check*
          # into a confident answer: _port_in_use returned "the port is free"
          # when the probe itself raised, and both PID lookups left pid at
          # None -- which the caller prints as "zombie socket", telling the
          # reader there is no process to stop when there is one. Those now
          # catch the errors those calls actually raise and print what
          # failed. The health poll keeps passing on connection-refused,
          # which is what a server that has not finished binding looks like,
          # but narrowed to OSError so a bug in the poll is no longer eaten
          # for the full 30s and then reported as "the server never started".
          # 70: the code sandbox's six. subprocess_executor's setrlimit
          # swallow dropped the only memory cap on the untrusted code it was
          # about to exec, and could not log because preexec_fn runs in the
          # forked child -- it now writes to fd 2, which the parent captures
          # as ExecutionResult.stderr. Its tempdir cleanup was a try around a
          # call that already had ignore_errors=True, so the handler caught
          # nothing while a failed removal left the executed script on disk.
          # docker_runner's _force_kill swallowed a failed `docker rm -f`,
          # which is the runaway container still holding CPU and memory, and
          # check_docker_health returned the same silent False for "docker is
          # not installed", "the image was never built" and "we broke this
          # function" -- while production gates code execution on it.
          # 67: api/streaming.py's three. The disconnect probe is the only
          # thing that cancels a run whose client has gone away, so while it
          # was broken the pipeline kept generating -- and billing -- for
          # nobody; it now reports once per stream rather than every ten
          # chunks. The follow-up learn() is the conversation's own memory.
          # The cached-run collector wrapped parse, collect and write in one
          # handler, so a parse failure also skipped the `done` detection
          # that is the only thing writing the cache: a serializer change
          # could have turned caching off for good and looked like a cold
          # cache. Split into three, each naming its own site.
          # 64: application/orchestrator.py's three. Provenance is not
          # free: a Neuro chunk written without model attribution cannot be
          # revoked by lineage, so it is dropped on recall rather than
          # replayed -- losing it silently means losing the memory write
          # silently, one recall later. The propagation-shape observer is the
          # only reading taken where a synthesis becomes something future
          # runs read back (docs/MIND_VIRUS_MITIGATION.md), and a detector
          # that had stopped scoring reported the same nothing as clean
          # traffic. The spend-cap short-circuit skipped its check entirely,
          # so a cap that could not be read looked like no cap set.
          # 58: widgets_legacy.py's three and image_generation.py's three.
          # _has_yahooquery/_has_yfinance had lost the import they were meant
          # to test, leaving `try: return True` -- so every machine reported
          # both libraries present, get_stock_data's Demo Mode branch was
          # unreachable, and a missing dependency surfaced as an ImportError
          # from inside the quote lookup. They use importlib.util.find_spec
          # now and need no handler at all. search_web returned [] for a dead
          # backend, which is what a topic with no news returns too.
          # image_generation's two base64 probes exist to decide whether text
          # is base64, so there the exception is the answer -- narrowed to
          # ValueError rather than signalled. Its outermost guard kept
          # str(exc), which is often empty, and dropped the traceback.
          python scripts/silent_failure_ratchet.py --max 58

      - name: Run tests
        run: |
          # -n/--dist used to come from pytest.ini addopts, which also forced
          # them onto the slow/integration lane and killed its workers.
          # --dist loadscope must accompany -n: see requirements-dev.txt.
          pytest tests/ -v \
            -m "not slow and not integration" \
            -n auto --dist loadscope \
            --tb=short \
            --timeout=60 \
            -q
        env:
          PYTHONPATH: ${{ env.PYTHONPATH }}
          CSRF_ENFORCE_BACKEND: 'false'
          # Dummy placeholder (NOT a real credential): build_provider() only checks
          # key presence. Mock tests patch ProviderRouter.call, so no network occurs.
          # Lets router/provider construction succeed for HyperGate models offline.
          OPENROUTER_API_KEY: 'ci-dummy-openrouter-key-placeholder'
          # Dummy placeholder (NOT a real credential): LocalAuthAdapter validates
          # JWT_SECRET_KEY length on instantiation during SaaS/auth test collection.
          JWT_SECRET_KEY: 'ci-test-secret-key-not-for-production-use-only'
          # CI has no Redis. The limiter defaults to redis + fail_closed, which
          # denies every request (429) when Redis is unreachable — tripping ~40
          # endpoint tests that expect 200/401. fail_open degrades gracefully to
          # the in-memory limiter, which still enforces limits for the dedicated
          # rate-limiter tests while letting normal requests through.
          RATE_LIMITER_REDIS_FAILURE_MODE: 'fail_open'

  tsc:
    name: TypeScript type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-next
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: ui-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # ui-next has had 23 vitest files and no job running them: the `npm test`
      # in the sdk job below caches a different lockfile, and quality.yml's
      # Playwright a11y spec is continue-on-error. So these 211 assertions,
      # four of them security suites, have never gated a merge.
      #
      # Here rather than in quality.yml: that workflow is path-filtered to
      # ui-next/** and advisory, and a backend change can break a frontend
      # contract test without touching a single ui-next file.
      - name: Test
        run: npm test

      - name: Design token guard (no raw Tailwind palette colors)
        run: |
          # global-error.tsx is exempt: it renders outside the root layout
          # (no globals.css, var() resolves to nothing there), so it uses
          # literal hex mirroring the tokens instead.
          ! grep -rEn --include=*.tsx --include=*.ts \
            --exclude=global-error.tsx \
            '(bg|text|border|from|to|via|ring|fill|stroke)-(slate|gray|zinc|neutral|stone|red|orange|amber|yellow|lime|green|emerald|teal|cyan|sky|blue|indigo|violet|purple|fuchsia|pink|rose)-[0-9]{2,3}' \
            src

  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      # tsconfig.build.json sets "types": [], so this also proves src/ pulls in
      # no Node globals — the SDK ships to browsers as well.
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.build.json

      - name: Test
        run: npm test
