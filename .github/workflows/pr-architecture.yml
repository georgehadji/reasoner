name: PR Architecture Checks

on:
  pull_request:
    branches: [ "main" ]

jobs:
  import-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: |
          pip install -r requirements.txt
          # Pinned: grimp's import-resolution granularity decides which ignore_imports
          # entries match. An unpinned install (grimp 3.14) drifted from the version the
          # .importlinter exception list was curated against. Bump this deliberately.
          pip install import-linter==2.12 grimp==3.14
      - name: Run import-linter
        run: PYTHONPATH=src lint-imports --no-cache
      - name: Check exception count
        run: |
          COUNT=$(grep -c '\->' .importlinter)
          echo "Import-linter exceptions: $COUNT"
          # Ceiling acts as a ratchet: catalogued pre-existing layering debt (subagents,
          # hypergate, quality, core/domain shims, renderer subpackage) brought this to 58.
          # Lower it as debt is paid down via DI; do not raise without a tracking issue.
          MAX=65
          if [ "$COUNT" -gt "$MAX" ]; then
            echo "FAIL: $COUNT exceptions exceeds maximum of $MAX"
            exit 1
          fi
          echo "PASS: $COUNT exceptions within limit of $MAX"