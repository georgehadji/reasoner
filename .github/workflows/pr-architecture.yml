name: PR Architecture Checks

on:
  pull_request:
    branches: [ "main" ]

jobs:
  import-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: |
          pip install -r requirements.txt
          # Pin toolchain: grimp's import-resolution granularity decides which
          # ignore_imports entries match. Unpinning causes drift and spurious
          # contract breaks. Bump deliberately, re-verifying the ignore list.
          pip install 'import-linter==2.12' 'grimp==3.14'
      - name: Run import-linter
        run: PYTHONPATH=src lint-imports --no-cache
      - name: Check exception count
        run: |
          COUNT=$(grep -c '\->' .importlinter)
          echo "Import-linter exceptions: $COUNT"
          # Honest baseline of real layering debt (the gate was crash-red on every
          # PR until the hyper_agent.py IndentationError was fixed, which had
          # masked the full violation set). Ratchet DOWN as debt is paid via DI
          # (mirror set_build_provider / set_searxng_circuit_breaker). Do not
          # raise without a tracking issue.
          MAX=65
          if [ "$COUNT" -gt "$MAX" ]; then
            echo "FAIL: $COUNT exceptions exceeds maximum of $MAX"
            exit 1
          fi
          echo "PASS: $COUNT exceptions within limit of $MAX"