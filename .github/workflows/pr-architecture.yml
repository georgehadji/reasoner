name: PR Architecture Checks

on:
  pull_request:
    branches: [ "main", "studio-adopt" ]

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No empty GitHub Actions expressions
        # docs/plans/root-cause-remediation-2026-09-07.md P1 step 6 / D13:
        # an empty expression (dollar, two braces, nothing inside) in a shell
        # comment in integration-live.yml invalidated the whole workflow file,
        # and both `yaml.safe_load` and `check-jsonschema` called it valid --
        # neither parses expression syntax, so this is the only check that
        # catches it. Nothing in this file spells the expression out: a
        # backslash does not escape Actions syntax, and the literal in the
        # messages below once made this very file invalid (every run failed
        # in 0s with no jobs).
        run: |
          if grep -rEln '\$\{\{[[:space:]]*\}\}' .github/workflows/; then
            echo "FAIL: empty expression (dollar, two braces, nothing inside) found" \
                 "above -- GitHub Actions refuses to run the whole file."
            exit 1
          fi
          echo "PASS: no empty expressions in .github/workflows/"

  generated-docs-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install project dependencies
        # The generator counts models and presets by importing reasoner. Without
        # these it read 0 for both and every PR "drifted" to 0.
        run: pip install -r requirements.txt
      - name: Regenerate and diff
        # docs/plans/root-cause-remediation-2026-09-07.md P1 step 5 / D12: the
        # post-commit hook that regenerated these files lived in .git/hooks/,
        # which core.hooksPath=.githooks no longer reads, so they went stale
        # silently. This replaces the dead hook with a gate that cannot be:
        # regenerate, then fail if anything but the generator's own date
        # stamps changed. Date-only diffs are excluded on purpose -- the
        # generator stamps "today" on every run, so a same-content PR opened
        # yesterday and merged today would otherwise fail on the date alone,
        # which is not drift.
        run: |
          python scripts/update_mindmap_meta.py
          # `git diff HEAD`, not `git diff`: the generator `git add`s what it
          # writes (_stage, from its post-commit-hook days), so an index diff
          # was always empty. `|| true`: grep exits 1 when it prints nothing,
          # and under the runner's `bash -e` that killed the step on a clean
          # tree. Together they meant this gate failed every run and could
          # never report real drift. Only a non-empty DRIFT fails, below.
          DRIFT=$(git diff HEAD -- ARCHITECTURE_MINDMAP.md docs/CODEMAPS ui-next/src/lib/capabilities.generated.ts CLAUDE.md \
            | grep -E '^[+-]' \
            | grep -Ev '^(\+\+\+|---)' \
            | grep -Ev '^[+-].*(Last Updated|Generated:|generatedAt).*[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)
          if [ -n "$DRIFT" ]; then
            echo "$DRIFT"
            echo "FAIL: generated docs are stale -- run" \
                 "'python scripts/update_mindmap_meta.py' and commit the diff."
            exit 1
          fi
          echo "PASS: generated docs match what the generator produces"

  import-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install project dependencies
        run: |
          pip install -r requirements.txt
          # Pin toolchain: grimp's import-resolution granularity decides which
          # ignore_imports entries match. Unpinning causes drift and spurious
          # contract breaks. Bump deliberately, re-verifying the ignore list.
          pip install 'import-linter==2.12' 'grimp==3.14'
      - name: Run import-linter
        run: PYTHONPATH=src lint-imports --no-cache
      - name: Check no direct application→registry import
        # AST-based, direct-imports-only guard. import-linter's `forbidden`
        # contract type checks the full transitive graph, which false-positives
        # here since infrastructure.llm.router (a legitimate app dependency)
        # itself imports registry internally. This script sidesteps that.
        run: python scripts/check_no_registry_bypass.py
      - name: Check exception count
        run: |
          # Semantic count via configparser (scripts/count_importlinter_exceptions.py),
          # not `grep -c '\->'` — a prose comment containing "->" would inflate a
          # naive grep count. Two-way ratchet: MAX must move in lockstep with the
          # real count, in either direction. Do not raise without a tracking issue.
          #
          # Contract 1 (layers) is at 44. It was 59 before Phase D: D-4 removed
          # three entries that matched nothing in the source at all --
          # data_eraser -> api.cache (no such import), and two TYPE_CHECKING-only
          # edges that exclude_type_checking_imports already drops. The plan
          # named a fourth, the renderer "duplicate": it is not one. `renderers`
          # and `renderers.*` match the package and its submodules respectively,
          # and import-linter reports both as used. One entry was then ADDED
          # (infrastructure.email.resend_adapter -> application.ports.email_port)
          # when ten missing __init__.py files brought 52 previously ungoverned
          # modules into the graph. The last 13 were application -> infrastructure
          # entries that never did anything: application sits ABOVE infrastructure
          # in the layers list, so that direction was already legal.
          #
          # Contract 2 is where those 13 really belong, along with the 39 sibling
          # imports that had no entry at all. It is at 52 and falls as D-1..D-3
          # invert each dependency through a port.
          PYTHONPATH=src python scripts/count_importlinter_exceptions.py --contract 1 --max 44
          PYTHONPATH=src python scripts/count_importlinter_exceptions.py --contract 2 --max 52