name: Coverage

on:
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.12'
  PYTHONPATH: src

jobs:
  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pytest-cov

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            -m "not slow and not integration" \
            --cov=src/reasoner \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short \
            -q
        env:
          PYTHONPATH: ${{ env.PYTHONPATH }}
          CSRF_ENFORCE_BACKEND: 'false'

      - name: Coverage gate
        run: |
          COVERAGE=$(python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          rate = float(root.attrib.get('line-rate', 0)) * 100
          print(f'{rate:.1f}')
          ")
          echo "Coverage: ${COVERAGE}%"
          # Hard floor reflects real unit-only coverage (job excludes
          # integration/slow). Acts as a regression ratchet — raise it
          # as coverage improves toward the 80% WARN target.
          python -c "
          cov = float('${COVERAGE}')
          if cov < 30:
              print(f'FAIL: Coverage {cov:.1f}% is below 30% hard floor')
              exit(1)
          elif cov < 80:
              print(f'WARN: Coverage {cov:.1f}% is below 80% target')
          else:
              print(f'OK: Coverage {cov:.1f}% meets target')
          "

      - name: Per-package coverage floor (domain/, core/)
        run: |
          # A global percentage lets clean domain/core code hide behind old
          # covered code elsewhere — floors pinned with headroom below the
          # measured baseline (domain 92.3%, core 81.9%), not the aspirational
          # 80% target. See Phase 0.10 in
          # docs/plans/architecture-score-9-remediation-plan.md.
          python scripts/package_coverage_gate.py --xml coverage.xml \
            --package domain:85 --package core:75

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14
