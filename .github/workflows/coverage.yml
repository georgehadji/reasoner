name: Coverage

on:
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.12'
  PYTHONPATH: src

jobs:
  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-asyncio pytest-cov

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            -m "not slow and not integration and not searxng" \
            --cov=src/reasoner \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short \
            -q
        env:
          PYTHONPATH: ${{ env.PYTHONPATH }}
          CSRF_ENFORCE_BACKEND: 'false'

      - name: Coverage gate
        run: |
          COVERAGE=$(python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          rate = float(root.attrib.get('line-rate', 0)) * 100
          print(f'{rate:.1f}')
          ")
          echo "Coverage: ${COVERAGE}%"
          # Hard floor reflects real unit-only coverage (job excludes
          # integration/slow/searxng). Acts as a regression ratchet — raise it
          # as coverage improves toward the 80% WARN target.
          python -c "
          cov = float('${COVERAGE}')
          if cov < 30:
              print(f'FAIL: Coverage {cov:.1f}% is below 30% hard floor')
              exit(1)
          elif cov < 80:
              print(f'WARN: Coverage {cov:.1f}% is below 80% target')
          else:
              print(f'OK: Coverage {cov:.1f}% meets target')
          "

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  preset-validation:
    name: Validate presets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate presets
        run: python scripts/validate_presets.py
        env:
          PYTHONPATH: ${{ env.PYTHONPATH }}
