name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # bandit pinned: scripts/bandit_ratchet.py compares an exact finding
      # count, and an unpinned linter makes that number drift with the tool
      # rather than with the code. 1.9.4 is what CI already resolved to.
      - run: pip install pip-audit bandit==1.9.4
      # Security checks are release gates; failures must not be hidden.
      # Suppression: a genuine false positive gets `# nosec <rule-id> —
      # <reason>, expires <date>` inline, reviewed in the PR that adds it.
      # No blanket / unreviewed suppression.
      - run: pip-audit --requirement requirements.txt
      # Two steps before: `bandit ... -o bandit-report.json` then a bare
      # `bandit -r src/`. The first still exits 1 on any finding -- `-o`
      # redirects the report, not the exit code -- and nothing in this repo
      # ever consumed bandit-report.json (no upload-artifact, no reader), so
      # it was a second full scan whose only effect was failing the job.
      # The bare run had the same problem: src/ carries 148 findings and no
      # `# nosec` anywhere, so this job failed the day it was written and
      # this workflow has no successful run in its last 100 -- it could not
      # report a NEW finding, because it was already red. The ratchet prints
      # every finding unchanged and fails on 149. Nothing is filtered or
      # skipped; see the script for the backlog.
      - run: python scripts/bandit_ratchet.py --max 148
      - run: python scripts/scan-secrets.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd ui-next && npm audit --audit-level high

  # SBOM + known-vulnerability scan of the dependency tree and Dockerfiles.
  # Fails the build on CRITICAL/HIGH findings (security-remediation-plan.md
  # Phase 6 item 4/5).
  sbom-and-image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM (backend)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-backend.cdx.json

      - name: Generate SBOM (frontend)
        uses: anchore/sbom-action@v0
        with:
          path: ./ui-next
          format: cyclonedx-json
          output-file: sbom-frontend.cdx.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-*.cdx.json

      - name: Scan dependency tree for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Scan Dockerfiles/compose for misconfiguration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'

  # Verifies requirements.lock.txt (hash-pinned, `scripts/lock_requirements.sh`)
  # is present and matches requirements.txt. Fails closed: an unlocked or
  # stale lockfile blocks the build rather than silently installing
  # unpinned/unverified transitive dependencies.
  lockfile-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-tools
      - name: Verify requirements.lock.txt exists and is current
        run: |
          if [ ! -f requirements.lock.txt ]; then
            echo "::error::requirements.lock.txt is missing. Run 'bash scripts/lock_requirements.sh' locally and commit the result."
            exit 1
          fi
          cp requirements.lock.txt /tmp/requirements.lock.txt.committed
          bash scripts/lock_requirements.sh
          # Compare dependency content, not the pip-compile provenance header.
          # `pip install pip-tools` above is unpinned, and the header records the
          # exact flags of whichever version CI resolved -- a newer pip-tools
          # writes `--no-index` into it, so a lockfile whose every pin and hash
          # matched still failed on a one-line comment diff. Only the top-level
          # `^#` header block is dropped; the indented `# via` provenance lines
          # and every requirement+hash line are still compared byte for byte.
          if ! diff -q <(grep -v '^#' /tmp/requirements.lock.txt.committed) <(grep -v '^#' requirements.lock.txt) > /dev/null; then
            echo "::error::requirements.lock.txt is stale. Run 'bash scripts/lock_requirements.sh' locally and commit the result."
            diff /tmp/requirements.lock.txt.committed requirements.lock.txt || true
            exit 1
          fi
