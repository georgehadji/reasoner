name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit bandit
      # Security checks are release gates; failures must not be hidden.
      # Suppression: a genuine false positive gets `# nosec <rule-id> —
      # <reason>, expires <date>` inline, reviewed in the PR that adds it.
      # No blanket / unreviewed suppression.
      #
      # PYSEC-2026-1845 (pytest <=9.0.2, /tmp/pytest-of-{user} naming, local
      # multi-user race) — reviewed 2026-08-22, expires 2027-02-01. pytest is
      # dev-only (never ships to prod) and CI runners are single-tenant, so
      # the local-multi-user precondition doesn't apply here. The fix
      # (pytest 9.x) needs a pytest-asyncio 0.2x->1.x migration with its own
      # breaking config changes — tracked separately, not worth forcing into
      # this gate. Re-review at expiry; drop this ignore once that migration
      # lands.
      - run: pip-audit --requirement requirements.txt --ignore-vuln PYSEC-2026-1845
      - run: bandit -r src/ -f json -o bandit-report.json
      - run: bandit -r src/
      - run: python scripts/scan-secrets.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd ui-next && npm audit --audit-level high

  # SBOM + known-vulnerability scan of the dependency tree and Dockerfiles.
  # Fails the build on CRITICAL/HIGH findings (security-remediation-plan.md
  # Phase 6 item 4/5).
  sbom-and-image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM (backend)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-backend.cdx.json

      - name: Generate SBOM (frontend)
        uses: anchore/sbom-action@v0
        with:
          path: ./ui-next
          format: cyclonedx-json
          output-file: sbom-frontend.cdx.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-*.cdx.json

      - name: Scan dependency tree for known vulnerabilities
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Scan Dockerfiles/compose for misconfiguration
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'

  # Verifies requirements.lock.txt (hash-pinned, `scripts/lock_requirements.sh`)
  # is present and matches requirements.txt. Fails closed: an unlocked or
  # stale lockfile blocks the build rather than silently installing
  # unpinned/unverified transitive dependencies.
  lockfile-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-tools
      - name: Verify requirements.lock.txt exists and is current
        run: |
          if [ ! -f requirements.lock.txt ]; then
            echo "::error::requirements.lock.txt is missing. Run 'bash scripts/lock_requirements.sh' locally and commit the result."
            exit 1
          fi
          cp requirements.lock.txt /tmp/requirements.lock.txt.committed
          bash scripts/lock_requirements.sh
          if ! diff -q /tmp/requirements.lock.txt.committed requirements.lock.txt > /dev/null; then
            echo "::error::requirements.lock.txt is stale. Run 'bash scripts/lock_requirements.sh' locally and commit the result."
            diff /tmp/requirements.lock.txt.committed requirements.lock.txt || true
            exit 1
          fi
