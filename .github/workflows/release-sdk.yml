name: Release SDK

# Publishes @reasoner/sdk to npm. Separate from the `sdk` job in test.yml,
# which runs on every push/PR as a gate; this only runs on a release tag, and
# only after both halves of the contract this SDK is tested against pass --
# the TypeScript side (npm test, including sdk/contract/*.json) and the
# Python side (tests/test_sdk_contract.py, which asserts the backend still
# emits what the SDK expects). A tag that fails either does not publish.
#
# Requires:
#   - npm scope/account access to @reasoner, recorded as the NPM_TOKEN secret
#   - the tag pattern sdk-v*, e.g. `git tag sdk-v0.2.0 && git push origin sdk-v0.2.0`
# npm publish itself is not something CI decides on its own -- it only runs
# because a maintainer deliberately pushed a release tag.

on:
  push:
    tags:
      - 'sdk-v*'

env:
  PYTHON_VERSION: '3.12'
  PYTHONPATH: src

jobs:
  contract:
    name: Verify contract (Python side)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-asyncio

      - name: Assert the backend still emits what this SDK expects
        run: pytest tests/test_sdk_contract.py -v
        env:
          PYTHONPATH: ${{ env.PYTHONPATH }}
          CSRF_ENFORCE_BACKEND: 'false'
          OPENROUTER_API_KEY: 'ci-dummy-openrouter-key-placeholder'
          JWT_SECRET_KEY: 'ci-test-secret-key-not-for-production-use-only'
          RATE_LIMITER_REDIS_FAILURE_MODE: 'fail_open'

  publish:
    name: Build, test, and publish
    needs: contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    permissions:
      contents: read
      id-token: write # OIDC token for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.build.json

      - name: Test (unit + contract, TypeScript side)
        run: npm test

      - name: Assert package.json version matches the tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#sdk-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag sdk-v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
