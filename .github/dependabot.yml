version: 2

updates:
  # Backend Python deps
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns:
          - "*"
    # Transitives whose parents pin or cap them. Neither is in requirements.txt;
    # scripts/lock_requirements.sh (pip-compile) resolves them into
    # requirements.lock.txt. Dependabot edits the lockfile's pins in place
    # without re-resolving, so it keeps proposing versions the parents forbid,
    # and lockfile-freshness fails every such PR (#91, #98):
    # - pydantic-core: pydantic 2.13.5 pins pydantic-core==2.46.5.
    # - websockets: realtime 2.31.0 requires websockets<16.
    # They move when their parents do, at the next lock regeneration.
    # - mcp: api/mcp/ is written against the v1 SDK (mcp.server.fastmcp);
    #   v2 renamed FastMCP to MCPServer, so a 2.x pin installs a server that
    #   cannot start. Lift once api/mcp/ and tests/test_mcp_tools.py migrate.
    ignore:
      - dependency-name: "pydantic-core"
      - dependency-name: "websockets"
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10

  # Frontend Node deps
  - package-ecosystem: "npm"
    directory: "/ui-next"
    schedule:
      interval: "weekly"
    groups:
      npm-deps:
        patterns:
          - "*"
    # Two majors held back on purpose. A "^5" / "^9" in package.json does not
    # hold them: after #75 set exactly that by hand, the next grouped update
    # (#90) rewrote them to "^7" / "^10".
    # - typescript: typescript-eslint (via eslint-config-next) supports
    #   TypeScript <6.1; on 7 `tsc` fails "typescript-eslint does not support
    #   TS 7.0".
    # - eslint: the eslint-plugin-react that eslint-config-next bundles calls
    #   context.getFilename(), removed in ESLint 10, so `npm run lint` crashes.
    #   eslint-config-next's own peer range allows 10; that plugin (7.37.5,
    #   its latest release) peers eslint up to ^9.7.
    # Lift each once typescript-eslint / eslint-config-next support it.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10

  # Docker base images — root backend image
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Docker base images — frontend
  - package-ecosystem: "docker"
    directory: "/ui-next"
    schedule:
      interval: "weekly"

  # Docker base images — sandbox worker + sandbox job image
  - package-ecosystem: "docker"
    directory: "/src/reasoner/infrastructure/execution/sandbox_worker"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/src/reasoner/infrastructure/execution/sandbox_worker/sandbox_image"
    schedule:
      interval: "weekly"

  # GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
