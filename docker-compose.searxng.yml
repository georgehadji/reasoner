services:
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8888:8080"
    volumes:
      - ./.searxng-settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "http://localhost:8080/", "-O", "/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
