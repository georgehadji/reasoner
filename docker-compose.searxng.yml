services:
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8888:8080"
    environment:
      - SEARXNG_SECRET_KEY=reasoner-ci-secret-key-change-in-prod
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "http://localhost:8080/", "-O", "/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
