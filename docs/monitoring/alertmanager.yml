# Alertmanager configuration for Reasoner production alerts.
#
# This config previously could not start at all, for three separate reasons:
#
#   1. It used ${SLACK_WEBHOOK_URL} and ${PAGERDUTY_ROUTING_KEY}. Alertmanager
#      performs NO environment-variable expansion, so those were treated as
#      literal URLs. Secrets are read from files instead — see below.
#   2. `title:` and `text:` were set inside webhook_configs. Those are
#      slack_configs fields; Alertmanager rejects unknown fields, so the whole
#      config failed to parse.
#   3. The default receiver posted to Alertmanager's own /api/v2/alerts, which
#      feeds every alert back into itself.
#
# As shipped this starts cleanly and records alerts, which are visible in the
# Alertmanager UI on :9093 and via `amtool alert`. Nothing is delivered off-box
# until you enable a receiver below — that requires a destination only you have.
#
# ── Enabling Slack ───────────────────────────────────────────────────────────
#   1. Create an incoming webhook: https://api.slack.com/messaging/webhooks
#   2. Write the URL to a file the container can read, e.g.
#        mkdir -p secrets && printf '%s' 'https://hooks.slack.com/...' > secrets/slack_url
#      docker-compose.observability.yml already mounts ./secrets at
#      /etc/alertmanager/secrets (read-only).
#   3. Uncomment `global.slack_api_url_file` and the slack_configs blocks.
#
# ── Enabling PagerDuty ───────────────────────────────────────────────────────
#   Same pattern: write the Events API v2 routing key to secrets/pagerduty_key
#   and uncomment the pagerduty_configs block.
#
# Verify with:  docker compose -f docker-compose.yml -f docker-compose.observability.yml \
#                 exec alertmanager amtool check-config /etc/alertmanager/alertmanager.yml

global:
  resolve_timeout: 5m
  # slack_api_url_file: /etc/alertmanager/secrets/slack_url

# No `templates:` entry: there is no templates directory in this repo, and the
# old config referenced slack.title / pd.description templates that were never
# written. The commented receivers below use them — add the directory and the
# .tmpl files at the same time you enable a receiver, or drop the template
# references and let Alertmanager use its defaults.

route:
  receiver: "default"
  group_by: ["alertname", "severity", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - receiver: "critical"
      matchers:
        - severity = "critical"
      repeat_interval: 1h
      continue: true

    - receiver: "warning"
      matchers:
        - severity = "warning"
      repeat_interval: 4h

receivers:
  # Recording-only. A receiver with no delivery config is valid: alerts are
  # still stored and visible in the UI and API. Replace this with a real
  # destination when you have one.
  - name: "default"

  - name: "warning"
    # slack_configs:
    #   - channel: "#alerts"
    #     send_resolved: true
    #     title: '{{ template "slack.title" . }}'
    #     text: '{{ template "slack.text" . }}'

  - name: "critical"
    # slack_configs:
    #   - channel: "#alerts-critical"
    #     send_resolved: true
    #     title: '{{ template "slack.title" . }}'
    #     text: '{{ template "slack.text" . }}'
    # pagerduty_configs:
    #   - routing_key_file: /etc/alertmanager/secrets/pagerduty_key
    #     severity: "critical"
    #     description: '{{ template "pd.description" . }}'
    #     details:
    #       firing: '{{ .Alerts.Firing | len }}'
    #       group: '{{ .GroupLabels.alertname }}'

inhibit_rules:
  # A critical alert already tells you the thing is broken; don't also page the
  # warning-level version of the same alert.
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["alertname", "service"]
