# Alertmanager configuration for Reasoner production alerts.
#
# Routes alerts to configured receivers based on severity and labels.
# Environment variables are substituted at runtime:
#   ${SLACK_WEBHOOK_URL}     — Slack incoming webhook URL
#   ${PAGERDUTY_ROUTING_KEY} — PagerDuty Events API v2 routing key
#   ${SMTP_HOST} / ...       — SMTP relay for email alerts (not shown here)
#
# Test: amtool alert add alertname=TestAlert severity=critical

route:
  receiver: "default"
  group_by: ["alertname", "severity", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  # Route critical alerts immediately to PagerDuty (if configured)
  routes:
    - receiver: "pagerduty-critical"
      match:
        severity: "critical"
      repeat_interval: 1h
      continue: true  # also send to default (Slack)

    - receiver: "slack-warning"
      match:
        severity: "warning"
      repeat_interval: 4h

receivers:
  # Default receiver — log to stdout and optionally Slack
  - name: "default"
    webhook_configs:
      - url: "${SLACK_WEBHOOK_URL}"
        send_resolved: true
      # Fallback: log to stdout so docker logs captures everything
      - url: "http://localhost:9093/api/v2/alerts"

  - name: "slack-warning"
    webhook_configs:
      - url: "${SLACK_WEBHOOK_URL}"
        send_resolved: true
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'

  - name: "pagerduty-critical"
    pagerduty_configs:
      - routing_key: "${PAGERDUTY_ROUTING_KEY}"
        severity: "critical"
        description: '{{ template "pd.description" . }}'
        details:
          firing: '{{ .Alerts.Firing | len }}'
          group: '{{ .GroupLabels.alertname }}'
