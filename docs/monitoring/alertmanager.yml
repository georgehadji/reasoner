# Alertmanager configuration for Reasoner production alerts.
#
# This config previously could not start at all, for three separate reasons:
#
#   1. It used ${SLACK_WEBHOOK_URL} and ${PAGERDUTY_ROUTING_KEY}. Alertmanager
#      performs NO environment-variable expansion, so those were treated as
#      literal URLs. Secrets are read from files instead — see below.
#   2. `title:` and `text:` were set inside webhook_configs. Those are
#      slack_configs fields; Alertmanager rejects unknown fields, so the whole
#      config failed to parse.
#   3. The default receiver posted to Alertmanager's own /api/v2/alerts, which
#      fed every alert back into itself instead of delivering anywhere.
#
# As shipped this starts cleanly and records alerts, visible in the
# Alertmanager UI on :9093 and via `amtool alert`. Nothing is delivered
# off-box until an operator enables a receiver below — that needs a
# destination only they have.
#
# ── Enabling Slack ───────────────────────────────────────────────────────────
#   1. Create an incoming webhook: https://api.slack.com/messaging/webhooks
#   2. Write the URL to a file the container can read, e.g.
#        mkdir -p secrets && printf '%s' 'https://hooks.slack.com/...' > secrets/slack_url
#      docker-compose.observability.yml mounts ./secrets at
#      /etc/alertmanager/secrets (read-only).
#   3. Uncomment `global.slack_api_url_file` and the slack_configs blocks below.
#
# ── Enabling PagerDuty ───────────────────────────────────────────────────────
#   Same pattern: write the Events API v2 routing key to secrets/pagerduty_key
#   and uncomment the pagerduty_configs block.
#
# Verify with:  docker compose -f docker-compose.yml -f docker-compose.observability.yml \
#                 exec alertmanager amtool check-config /etc/alertmanager/alertmanager.yml

global:
  resolve_timeout: 5m
  # slack_api_url_file: /etc/alertmanager/secrets/slack_url

# No `templates:` entry: there is no templates directory in this repo. The
# commented receivers below use Alertmanager's own defaults rather than
# slack.title / pd.description templates that were never written — add a
# templates directory and .tmpl files if custom formatting is wanted.

route:
  receiver: "default"
  group_by: ["alertname", "severity", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - receiver: "critical"
      matchers:
        - severity = "critical"
      repeat_interval: 1h
      continue: true

    - receiver: "warning"
      matchers:
        - severity = "warning"
      repeat_interval: 4h

receivers:
  # Recording-only. A receiver with no delivery config is valid: alerts are
  # still stored and visible in the UI and API. Replace with a real
  # destination when one exists.
  - name: "default"

  - name: "warning"
    # slack_configs:
    #   - channel: "#alerts"
    #     send_resolved: true

  - name: "critical"
    # slack_configs:
    #   - channel: "#alerts-critical"
    #     send_resolved: true
    # pagerduty_configs:
    #   - routing_key_file: /etc/alertmanager/secrets/pagerduty_key
    #     severity: "critical"

# No inhibit_rules. The one that used to live here inhibited severity=warning
# when a severity=critical alert shared `alertname` and `service`. Critical and
# warning tiers are separate rules with different names (HighErrorRate vs
# CriticalErrorRate, MemoryWarning vs MemoryCritical), so requiring equal
# `alertname` across the two severities could never match and the rule
# suppressed nothing. Add one back only on labels the paired alerts genuinely
# share, and only where suppression is wanted (every alert from the backend
# target carries the same `service`, so inhibiting on it alone would hide all
# warnings whenever any critical fires).
inhibit_rules: []
