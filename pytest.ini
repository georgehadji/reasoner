[pytest]
testpaths = tests
pythonpath = src
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as fast isolated unit tests
    timeout: marks tests with a timeout threshold (requires pytest-timeout)
    docker: marks tests that require a reachable Docker daemon (auto-skipped otherwise)
filterwarnings =
    ignore::DeprecationWarning

# Parallelism is NOT set here. addopts applies to every invocation, including
# the slow/integration lane, and `-n auto` there put eight concurrent full
# LLM pipelines on one machine and killed the workers:
#
#     [gw2] node down: Not properly terminated
#     INTERNALERROR> KeyError: <WorkerController gw7>
#
# Working around that needed `-n 0` on the command line every time. The five
# invocations that run the whole fast suite now pass `-n auto --dist loadscope`
# themselves: test.yml, coverage.yml, self-healing-ci.yml, and the two gates in
# scripts/ci-local.sh.
#
# --dist loadscope is load-bearing where it is set, not decoration. See the
# pytest-randomly note in requirements-dev.txt: it pins which modules share a
# worker, which is what the T1 order-dependence sweep relies on. Keep it
# alongside every -n.
addopts = --durations=10
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session

[coverage:run]
source = src/reasoner
omit =
    */healing/generated_tests/*
    */tests/*
    */__pycache__/*

[coverage:report]
skip_covered = false
show_missing = true
sort = Cover
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:

