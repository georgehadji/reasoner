services:
  cert-generator:
    image: alpine:3.24.1
    command:
      - sh
      - -c
      - |
        set -e
        apk add --no-cache openssl
        mkdir -p /certs
        # Regenerate the CA when EITHER file is missing: a run that died between
        # genrsa and req would otherwise leave ca.key alone and fail every later run.
        if [ ! -f /certs/ca.key ] || [ ! -f /certs/ca.crt ]; then
          openssl genrsa -out /certs/ca.key 4096
          # keyUsage is not in the stock openssl.cnf. Python 3.13+ (the backend
          # image's healthcheck) verifies with VERIFY_X509_STRICT, which rejects
          # a CA without keyUsage=keyCertSign. Stock config already adds
          # basicConstraints=critical,CA:TRUE.
          openssl req -x509 -new -nodes -key /certs/ca.key -sha256 -days 3650 \
            -out /certs/ca.crt -subj '/CN=Internal CA' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign'
        fi
        for service in backend frontend postgres valkey; do
          openssl genrsa -out /certs/$$service.key 2048
          openssl req -new -key /certs/$$service.key -out /certs/$$service.csr -subj "/CN=$$service"
          # One SAN file per service so each cert names only its own host.
          printf 'subjectAltName = DNS:%s, DNS:localhost\n' "$$service" > /certs/$$service.ext
          openssl x509 -req -in /certs/$$service.csr -CA /certs/ca.crt -CAkey /certs/ca.key \
            -CAcreateserial -out /certs/$$service.crt -days 365 -sha256 -extfile /certs/$$service.ext
        done
        chmod 644 /certs/*.crt
        chmod 600 /certs/*.key
        # The /certs mount is read-only and root-owned, but each consumer reads
        # its own key as a non-root user, so a root-owned 0600 key is unreadable
        # and the service dies at boot. Hand each key to the uid its service runs as.
        #   backend  appuser (uid pinned to 10001 in the Dockerfile)
        #   postgres postgres:16-alpine runs as uid 70, and refuses a key that is
        #            not 0600 and owned by that user (or root)
        #   valkey   valkey/valkey runs as uid 999 after dropping root
        # frontend's key is never read (it only trusts ca.crt), so it stays root-only.
        chown 10001:10001 /certs/backend.key
        chown 70:70 /certs/postgres.key
        chown 999:999 /certs/valkey.key
    volumes:
      - internal_certs:/certs

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - internal_certs:/certs:ro
    depends_on:
      cert-generator:
        condition: service_completed_successfully
      frontend:
        condition: service_started
      backend:
        # backend's Dockerfile HEALTHCHECK doesn't pass until the server is
        # actually accepting requests; service_started only waits for the
        # process to launch, so caddy was proxying to a backend that was
        # still mid-`alembic upgrade head` and returning 502s.
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.125'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  backend:
    build: .
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/reasoner?sslmode=require
      - VALKEY_URL=rediss://valkey:6379/0
      # Deprecated: REDIS_URL still supported for backward compat
      - REDIS_URL=rediss://valkey:6379/0
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - ENVIRONMENT=production
      - ENABLE_LEGACY_API_KEY=false
      - AUTH_PERSISTENCE_ENABLED=true
      - UVICORN_WORKERS=8
      - SSL_CERTFILE=/certs/backend.crt
      - SSL_KEYFILE=/certs/backend.key
      # Code execution: backend never touches Docker itself — it only calls
      # sandbox-worker over the internal network. EXEC_SANDBOX_ENABLED stays
      # false until an operator opts in; see .env.example.
      - SANDBOX_WORKER_URL=http://sandbox-worker:8901
      - SANDBOX_WORKER_TOKEN=${SANDBOX_WORKER_TOKEN:-}
    env_file:
      - .env
    depends_on:
      cert-generator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - ./cache:/app/cache
      - ./history:/app/history
      - ./uploads:/app/uploads
      - internal_certs:/certs:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  frontend:
    build: ./ui-next
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      # Server-only upstream target; do not expose the root .env to Next.js.
      - API_BASE_URL=https://backend:8000
      - NODE_EXTRA_CA_CERTS=/certs/ca.crt
    depends_on:
      cert-generator:
        condition: service_completed_successfully
      backend:
        condition: service_started
    volumes:
      - internal_certs:/certs:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: reasoner
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - internal_certs:/certs:ro
    command: >
      -c ssl=on
      -c ssl_cert_file=/certs/postgres.crt
      -c ssl_key_file=/certs/postgres.key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  valkey:
    image: valkey/valkey:8.1.8
    volumes:
      - valkey_data:/data
      - internal_certs:/certs:ro
    command: >
      valkey-server
      --port 0
      --tls-port 6379
      --tls-cert-file /certs/valkey.crt
      --tls-key-file /certs/valkey.key
      --tls-ca-cert-file /certs/ca.crt
    healthcheck:
      test: ["CMD", "valkey-cli", "--tls", "--cert", "/certs/valkey.crt", "--key", "/certs/valkey.key", "--cacert", "/certs/ca.crt", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.125'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # ── Code execution sandbox (security-remediation-plan.md Phase 1) ──
  # `backend` never has Docker access. `docker-socket-proxy` exposes only
  # the container/image verbs sandbox-worker needs — no exec, networks,
  # volumes, build, swarm, or secrets access to the real Docker socket.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.2.0
    environment:
      CONTAINERS: 1   # create/start/wait/logs/remove job containers
      IMAGES: 1        # inspect the sandbox image for health checks
      INFO: 1
      POST: 1          # required alongside CONTAINERS for create/start/remove
      # Everything else stays default-denied: EXEC, NETWORKS, VOLUMES,
      # BUILD, COMMIT, SERVICES, SWARM, NODES, SECRETS, CONFIGS, TASKS,
      # PLUGINS, SESSION, AUTH, DISTRIBUTION.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Before enabling EXEC_SANDBOX_ENABLED=true, build the per-job sandbox
  # image once so it's present on the Docker host sandbox-worker talks to
  # (docker-socket-proxy intentionally has BUILD disabled, so this can't
  # happen automatically through the proxy):
  #   docker build -t reasoner-sandbox-python:latest \
  #     -f src/reasoner/infrastructure/execution/sandbox_worker/sandbox_image/Dockerfile \
  #     src/reasoner/infrastructure/execution/sandbox_worker/sandbox_image
  sandbox-worker:
    build:
      context: .
      dockerfile: src/reasoner/infrastructure/execution/sandbox_worker/Dockerfile
    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - SANDBOX_WORKER_TOKEN=${SANDBOX_WORKER_TOKEN:-}
    depends_on:
      docker-socket-proxy:
        condition: service_started
    restart: unless-stopped
    # No published ports — reachable only from `backend`, as
    # http://sandbox-worker:8901, over the internal Compose network.
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

volumes:
  postgres_data:
  valkey_data:
  caddy_data:
  caddy_config:
  internal_certs:

