services:
  cert-generator:
    image: alpine:latest
    command: >
      sh -c "apk add --no-cache openssl &&
             mkdir -p /certs &&
             if [ ! -f /certs/ca.key ]; then
               openssl genrsa -out /certs/ca.key 4096 &&
               openssl req -x509 -new -nodes -key /certs/ca.key -sha256 -days 3650 -out /certs/ca.crt -subj '/CN=Internal CA'
             fi &&
             for service in backend frontend postgres valkey; do
               openssl genrsa -out /certs/$$service.key 2048 &&
               openssl req -new -key /certs/$$service.key -out /certs/$$service.csr -subj \"/CN=$$service\" &&
               openssl x509 -req -in /certs/$$service.csr -CA /certs/ca.crt -CAkey /certs/ca.key -CAcreateserial -out /certs/$$service.crt -days 365 -sha256 -extfile /certs/extfile.cnf || 
               (echo \"subjectAltName = DNS:$$service, DNS:localhost\" > /certs/extfile.cnf &&
                openssl x509 -req -in /certs/$$service.csr -CA /certs/ca.crt -CAkey /certs/ca.key -CAcreateserial -out /certs/$$service.crt -days 365 -sha256 -extfile /certs/extfile.cnf)
             done &&
             chmod -R 644 /certs/*.crt &&
             chmod -R 600 /certs/*.key"
    volumes:
      - internal_certs:/certs

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - internal_certs:/certs:ro
    depends_on:
      cert-generator:
        condition: service_completed_successfully
      frontend:
        condition: service_started
      backend:
        # service_started meant Caddy began proxying while the backend was still
        # running migrations and importing, so every deploy served 502s until it
        # caught up. The image healthcheck is meaningful now that it speaks TLS,
        # so wait for it.
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.125'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  backend:
    build: .
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/reasoner?sslmode=require
      - VALKEY_URL=rediss://valkey:6379/0
      # Deprecated: REDIS_URL still supported for backward compat
      - REDIS_URL=rediss://valkey:6379/0
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - ENVIRONMENT=production
      # Keep the feedback DB on a mounted volume — the default path is inside
      # src/, which lives in the image and is wiped on every redeploy.
      - FEEDBACK_DB_PATH=/app/history/feedback.db
      # Both of these default to paths inside the image, which the volumes below
      # do not cover — uploads and pipeline-ownership records were destroyed on
      # every redeploy.
      - UPLOAD_DIR=/app/uploads
      - EVENT_STORE_PATH=/app/history/events.db
      - ENABLE_LEGACY_API_KEY=false
      # 3, not 8. Each worker is a full process: measured 110 MB RSS at import
      # before serving anything, so 8 workers need ~880 MB of the 1 G limit below
      # and the OOM killer arrives under load. The app is I/O-bound on LLM calls,
      # so concurrency comes from async, not from worker count. Raise this only
      # together with the memory limit.
      - UVICORN_WORKERS=3
      - SSL_CERTFILE=/certs/backend.crt
      - SSL_KEYFILE=/certs/backend.key
    env_file:
      - .env
    depends_on:
      cert-generator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - ./cache:/app/cache
      - ./history:/app/history
      - ./uploads:/app/uploads
      - internal_certs:/certs:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  frontend:
    build: ./ui-next
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - NODE_EXTRA_CA_CERTS=/certs/ca.crt
    env_file:
      - .env
    depends_on:
      cert-generator:
        condition: service_completed_successfully
      backend:
        condition: service_started
    volumes:
      - internal_certs:/certs:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: reasoner
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - internal_certs:/certs:ro
    command: >
      -c ssl=on
      -c ssl_cert_file=/certs/postgres.crt
      -c ssl_key_file=/certs/postgres.key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  valkey:
    image: valkey/valkey:8.1.8
    volumes:
      - valkey_data:/data
      - internal_certs:/certs:ro
    command: >
      valkey-server
      --port 0
      --tls-port 6379
      --tls-cert-file /certs/valkey.crt
      --tls-key-file /certs/valkey.key
      --tls-ca-cert-file /certs/ca.crt
    healthcheck:
      test: ["CMD", "valkey-cli", "--tls", "--cert", "/certs/valkey.crt", "--key", "/certs/valkey.key", "--cacert", "/certs/ca.crt", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.125'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

volumes:
  postgres_data:
  valkey_data:
  caddy_data:
  caddy_config:
  internal_certs:

